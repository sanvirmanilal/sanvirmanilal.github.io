name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sanvirmanilal/sanvir-net

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Check site files
        run: test -s index.html && test -s profile.jpg

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://sanvir.net
    env:
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Upload deploy files
        run: |
          ssh vps 'mkdir -p /opt/apps/sanvir-net'
          scp deploy/compose.yaml deploy/sanvir-net.caddy deploy/remote-deploy.sh vps:/opt/apps/sanvir-net/

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Short-lived registry login: the token expires when this job ends.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vps "bash /opt/apps/sanvir-net/remote-deploy.sh '${{ github.sha }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"

      - name: Check the site through the VPS and through Cloudflare
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Straight to the origin (-k: the Cloudflare origin certificate is not
          # publicly trusted), so this also works before DNS points at the VPS.
          curl -fsS -k -o /dev/null --resolve "sanvir.net:443:$VPS_HOST" https://sanvir.net/
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null https://sanvir.net/; then echo "Site is up"; exit 0; fi
            sleep 5
          done
          echo "https://sanvir.net/ did not respond with 2xx" >&2
          exit 1
